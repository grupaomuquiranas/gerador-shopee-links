<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador Shopee</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      margin: 10px 0;
      font-size: 14px;
    }

    button {
      padding: 12px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      background: #ee4d2d;
      color: white;
      border: none;
      border-radius: 5px;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <h2>🔗 Gerador de Links Shopee</h2>

  <p>Cole até <b>5 links</b> (1 por linha):</p>

  <textarea id="links" rows="6" placeholder="Cole aqui seus links da Shopee"></textarea>

  <button onclick="gerar()">Gerar Links Curtos</button>

  <h3>Resultado:</h3>

  <textarea id="resultado" rows="6" readonly></textarea>

  <script>
    // SEU ID + SUBID
    const afiliado = "18368450207.Grupaomuquiranas";

    // Função para encurtar
    async function encurtar(url) {
      const api =
        "https://is.gd/create.php?format=simple&url=" +
        encodeURIComponent(url);

      const res = await fetch(api);
      return await res.text();
    }

    // Função principal
    async function gerar() {
      const texto = document.getElementById("links").value;
      const linhas = texto.split("\n").slice(0, 5); // limita em 5

      let saida = [];

      document.getElementById("resultado").value = "Gerando...";

      for (let link of linhas) {
        if (link.trim() !== "") {

          // Cria link afiliado
          let afiliadoLink =
            link.trim() + "?smtt=" + afiliado;

          try {
            // Encurta
            let curto = await encurtar(afiliadoLink);
            saida.push(curto);

          } catch {
            saida.push("Erro: " + afiliadoLink);
          }
        }
      }

      document.getElementById("resultado").value =
        saida.join("\n");
    }
  </script>

</body>
</html>
