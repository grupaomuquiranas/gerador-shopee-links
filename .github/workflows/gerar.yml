
name: Gerar Links Shopee

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
    - name: Checar o código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: pip install requests

    - name: Rodar script
      run: python gerar.py
      env:
        SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
        SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        SHOPEE_APP_KEY: ${{ secrets.SHOPEE_APP_KEY }}

    - name: Commit resultado
      run: |
        git config --global user.name "bot"
        git config --global user.email "bot@github.com"
        git add resultado.txt
        git commit -m "Gerado"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
