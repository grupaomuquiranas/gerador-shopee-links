name: Gerar Links Shopee

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - run: pip install requests

    - name: Rodar script gerar.py
      run: python gerar.py
      env:
        SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
        SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        SHOPEE_APP_KEY: ${{ secrets.SHOPEE_APP_KEY }}

    - name: Upload resultado
      uses: actions/upload-artifact@v3
      with:
        name: resultado-shopee
        path: resultado.txt
